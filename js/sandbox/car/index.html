<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>City Car</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif;touch-action:none}
  #c{display:block;width:100%;height:100%}
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);z-index:20;
  }
  #overlay h1{color:#ffd400;font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:4px;margin-bottom:10px;text-shadow:0 2px 20px rgba(255,212,0,.5);}
  #overlay p{color:#ccc;font-size:clamp(.8rem,2.5vw,.95rem);margin-bottom:36px;text-align:center;max-width:300px;line-height:1.8;}
  #startBtn{padding:16px 56px;border:none;border-radius:999px;font-size:clamp(1rem,3vw,1.25rem);font-weight:800;background:#ffd400;color:#111;cursor:pointer;box-shadow:0 4px 28px rgba(255,212,0,.45);transition:transform .1s,box-shadow .1s;}
  #startBtn:active{transform:scale(.95)}
  #hud{position:fixed;top:12px;right:12px;color:#fff;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:10px;font-size:14px;line-height:1.8;white-space:pre;z-index:10;display:none;font-variant-numeric:tabular-nums;}
  #recalBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 28px;border:none;border-radius:999px;font-size:14px;font-weight:700;background:rgba(255,212,0,.92);color:#111;cursor:pointer;z-index:10;display:none;box-shadow:0 2px 12px rgba(0,0,0,.4);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>CITY CAR</h1>
  <p>기기를 앞뒤로 기울여 가속/감속,<br>좌우로 기울여 조향하세요.<br>데스크탑: 방향키(↑↓←→) 또는 WASD<br><br>모바일 시작 시 센서 접근 허용이 필요합니다.</p>
  <button id="startBtn">GAME START</button>
</div>
<div id="hud"></div>
<button id="recalBtn">리캘리브레이션</button>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ─── constants ───────────────────────────────────────────────────────────────
const TILE   = 12;
const MAP_W  = 128, MAP_H = 128;
const HALF_W = MAP_W/2, HALF_H = MAP_H/2;
const T = {ROAD:0, BUILDING:1, PARK:2, WATER:3, BRIDGE:4};

// ─── rng ─────────────────────────────────────────────────────────────────────
let _s = 0xdeadbeef;
function rng() {
  _s = Math.imul(_s^(_s>>>16),0x45d9f3b);
  _s = Math.imul(_s^(_s>>>16),0x45d9f3b);
  _s ^= _s>>>16;
  return (_s>>>0)/0xffffffff;
}

// ─── map ─────────────────────────────────────────────────────────────────────
const tileMap  = new Uint8Array(MAP_W*MAP_H).fill(T.BUILDING);
const waterMrk = new Uint8Array(MAP_W*MAP_H);
const bldgH    = new Uint8Array(MAP_W*MAP_H);

function mi(x,y){return y*MAP_W+x;}
function fillRect(x0,y0,w,h,val,buf=tileMap){
  for(let dy=0;dy<h;dy++) for(let dx=0;dx<w;dx++){
    const x=x0+dx,y=y0+dy;
    if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H)buf[mi(x,y)]=val;
  }
}

function buildMap(){
  for(let i=0;i<5;i++){
    if(rng()<0.5){
      const wy=12+Math.floor(rng()*(MAP_H-24));
      const ww=2+Math.floor(rng()*3);
      fillRect(0,wy,MAP_W,ww,T.WATER); fillRect(0,wy,MAP_W,ww,1,waterMrk);
    }else{
      const wx=12+Math.floor(rng()*(MAP_W-24));
      const ww=2+Math.floor(rng()*3);
      fillRect(wx,0,ww,MAP_H,T.WATER); fillRect(wx,0,ww,MAP_H,1,waterMrk);
    }
  }
  for(let y=6;y<MAP_H-6;){
    const w=[1,1,2,2,2,3,4][Math.floor(rng()*7)];
    fillRect(0,y,MAP_W,w,T.ROAD);
    y+=6+Math.floor(rng()*14);
  }
  for(let x=6;x<MAP_W-6;){
    const w=[1,1,2,2,2,3,4][Math.floor(rng()*7)];
    fillRect(x,0,w,MAP_H,T.ROAD);
    x+=6+Math.floor(rng()*14);
  }
  fillRect(HALF_W-1,0,3,MAP_H,T.ROAD);
  fillRect(0,HALF_H-1,MAP_W,3,T.ROAD);
  for(let i=0;i<MAP_W*MAP_H;i++)
    if(tileMap[i]===T.ROAD&&waterMrk[i])tileMap[i]=T.BRIDGE;
  for(let i=0;i<20;i++){
    const px=4+Math.floor(rng()*(MAP_W-14)),py=4+Math.floor(rng()*(MAP_H-14));
    const pw=3+Math.floor(rng()*8),ph=3+Math.floor(rng()*8);
    let ok=true;
    loop:for(let dy=0;dy<ph;dy++) for(let dx=0;dx<pw;dx++)
      if(tileMap[mi(px+dx,py+dy)]!==T.BUILDING){ok=false;break loop;}
    if(ok)fillRect(px,py,pw,ph,T.PARK);
  }
  for(let i=0;i<30;i++){
    const bx=4+Math.floor(rng()*(MAP_W-14)),by=4+Math.floor(rng()*(MAP_H-14));
    const bw=3+Math.floor(rng()*5),bh=3+Math.floor(rng()*5);
    const ht=6+Math.floor(rng()*5);
    let ok=true;
    loop:for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++)
      if(tileMap[mi(bx+dx,by+dy)]!==T.BUILDING){ok=false;break loop;}
    if(ok) for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++)
      bldgH[mi(bx+dx,by+dy)]=ht;
  }
  for(let i=0;i<MAP_W*MAP_H;i++)
    if(tileMap[i]===T.BUILDING&&bldgH[i]===0)
      bldgH[i]=1+Math.floor(rng()*3);
}
buildMap();

// ─── coord ───────────────────────────────────────────────────────────────────
function tileCenter(tx,ty){return{x:(tx-HALF_W+0.5)*TILE,z:(ty-HALF_H+0.5)*TILE};}
function tileAt(wx,wz){
  const tx=Math.floor(wx/TILE+HALF_W), ty=Math.floor(wz/TILE+HALF_H);
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return T.BUILDING;
  return tileMap[mi(tx,ty)];
}
function passable(wx,wz){const t=tileAt(wx,wz);return t===T.ROAD||t===T.BRIDGE;}

// ─── renderer ────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 200, 440);

const camera = new THREE.PerspectiveCamera(42,1,1,700);
camera.up.set(0,0,-1);

// ─── lighting ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 2.2));
scene.add(new THREE.HemisphereLight(0x99ccff, 0x66aa44, 1.2));
const sun = new THREE.DirectionalLight(0xfff0cc, 2.0);
sun.position.set(60,90,50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-200,right:200,top:200,bottom:-200,near:1,far:500});
scene.add(sun);

// ─── scene geometry ──────────────────────────────────────────────────────────
const cnt = new Array(5).fill(0);
for(let i=0;i<MAP_W*MAP_H;i++)cnt[tileMap[i]]++;

const flatGeo  = new THREE.BoxGeometry(TILE,0.5,TILE);
const bldgBase = new THREE.BoxGeometry(TILE*0.84,1,TILE*0.84);

const matRoad   = new THREE.MeshToonMaterial({color:0x555566});
const matBridge = new THREE.MeshToonMaterial({color:0x997755});
const matPark   = new THREE.MeshToonMaterial({color:0x55bb44});
const matWater  = new THREE.MeshToonMaterial({color:0x3399dd});

const BLDG_COLORS = [0xff8844,0x4499ee,0xffcc33,0x44bb77,0xff55aa,0xaa77ee];
const bldgCnt = new Array(6).fill(0);
for(let i=0;i<MAP_W*MAP_H;i++) if(tileMap[i]===T.BUILDING)bldgCnt[i%6]++;

function iMesh(geo,mat,n){
  const m=new THREE.InstancedMesh(geo,mat,Math.max(1,n));
  m.castShadow=m.receiveShadow=true;
  scene.add(m);return m;
}

const mRoad   = iMesh(flatGeo, matRoad,   cnt[T.ROAD]);
const mBridge = iMesh(flatGeo, matBridge, cnt[T.BRIDGE]);
const mPark   = iMesh(flatGeo, matPark,   cnt[T.PARK]);
const mWater  = iMesh(flatGeo, matWater,  cnt[T.WATER]);
const mBldgs  = BLDG_COLORS.map((c,i)=>
  iMesh(bldgBase, new THREE.MeshToonMaterial({color:c}), bldgCnt[i])
);

const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(MAP_W*TILE,MAP_H*TILE),
  new THREE.MeshToonMaterial({color:0xaa9966})
);
gnd.rotation.x=-Math.PI/2; gnd.position.y=-0.1; gnd.receiveShadow=true;
scene.add(gnd);

const D = new THREE.Object3D();
const bi=[0,0,0,0,0,0];
let ri=0,bri=0,pi=0,wi=0;

for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
  const id=mi(tx,ty), tp=tileMap[id];
  const {x,z}=tileCenter(tx,ty);
  D.rotation.set(0,0,0);
  if(tp===T.ROAD){
    D.position.set(x,0.25,z);D.scale.set(1,1,1);D.updateMatrix();
    mRoad.setMatrixAt(ri++,D.matrix);
  }else if(tp===T.BRIDGE){
    D.position.set(x,0.25,z);D.scale.set(1,1,1);D.updateMatrix();
    mBridge.setMatrixAt(bri++,D.matrix);
  }else if(tp===T.PARK){
    D.position.set(x,0.2,z);D.scale.set(1,1,1);D.updateMatrix();
    mPark.setMatrixAt(pi++,D.matrix);
  }else if(tp===T.WATER){
    D.position.set(x,-0.15,z);D.scale.set(1,1,1);D.updateMatrix();
    mWater.setMatrixAt(wi++,D.matrix);
  }else if(tp===T.BUILDING){
    const ci=id%6, h=Math.max(1,bldgH[id]), bh=h*TILE*0.22;
    D.position.set(x,bh/2+0.4,z);D.scale.set(1,bh,1);D.updateMatrix();
    mBldgs[ci].setMatrixAt(bi[ci]++,D.matrix);
  }
}
[mRoad,mBridge,mPark,mWater,...mBldgs].forEach(m=>m.instanceMatrix.needsUpdate=true);

const dashGeo = new THREE.PlaneGeometry(TILE*0.06,TILE*0.3);
const dashMat = new THREE.MeshBasicMaterial({color:0xffffff,opacity:0.45,transparent:true});
const dashPos = [];
for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
  if(tileMap[mi(tx,ty)]!==T.ROAD)continue;
  if(tx>0&&tx<MAP_W-1&&tileMap[mi(tx-1,ty)]===T.ROAD&&tileMap[mi(tx+1,ty)]===T.ROAD&&
     ty>0&&tileMap[mi(tx,ty-1)]!==T.ROAD)
    dashPos.push(tileCenter(tx,ty));
}
if(dashPos.length>0){
  const dm=new THREE.InstancedMesh(dashGeo,dashMat,dashPos.length);
  dashPos.forEach(({x,z},i)=>{
    D.rotation.set(-Math.PI/2,0,0);D.position.set(x,0.52,z);D.scale.set(1,1,1);D.updateMatrix();
    dm.setMatrixAt(i,D.matrix);
  });
  dm.instanceMatrix.needsUpdate=true; scene.add(dm);
}

// ─── car + character: cartoon 3D top-view vehicle ───────────────────────────
// Car faces local +X direction.
const carGroup  = new THREE.Group();
const carVisual = new THREE.Group();
carGroup.add(carVisual);
scene.add(carGroup);

const blobShadow = new THREE.Mesh(
  new THREE.CircleGeometry(TILE * 0.55, 20),
  new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.38, depthWrite:false})
);
blobShadow.rotation.x = -Math.PI / 2;
blobShadow.position.y = 0.06;
carGroup.add(blobShadow);

const R = TILE * 0.24;

// materials
const redMat    = new THREE.MeshToonMaterial({ color: 0xd71920 });
const darkRedMat= new THREE.MeshToonMaterial({ color: 0x8f1016 });
const blackMat  = new THREE.MeshToonMaterial({ color: 0x151515 });
const tireMat   = new THREE.MeshToonMaterial({ color: 0x050505 });
const metalMat  = new THREE.MeshToonMaterial({ color: 0xd9d9d9 });
const whiteMat  = new THREE.MeshToonMaterial({ color: 0xffffff });
const skinMat   = new THREE.MeshToonMaterial({ color: 0xffd1a6 });
const glassMat  = new THREE.MeshToonMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
const eyeMat    = new THREE.MeshBasicMaterial({ color: 0x111111 });
const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function addBox(parent, size, pos, mat, cast = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.castShadow = cast; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
function addSphere(parent, radius, pos, scale, mat, seg = 16) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, seg, Math.max(8, seg * 0.7)), mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
function addCylinder(parent, radiusTop, radiusBottom, height, pos, rot, mat, seg = 16) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, seg), mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.rotation.set(rot[0], rot[1], rot[2]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}

// ── vehicle body ──────────────────────────────────────────────────────────────
addBox(carVisual, [R*2.9, R*0.52, R*2.15], [0, R*0.48+0.32, 0], redMat);

addCylinder(carVisual, R*0.42, R*0.42, R*2.35,
  [R*1.65, R*0.45+0.28, 0], [Math.PI/2, 0, 0], redMat, 20);

[-R*0.55, R*0.55].forEach(z =>
  addBox(carVisual, [R*0.12, R*0.12, R*0.28], [R*1.66, R*0.86, z], stripeMat, false));

addBox(carVisual, [R*1.12, R*0.70, R*1.50], [-R*0.62, R*0.95+0.32, 0], darkRedMat);
addBox(carVisual, [R*0.34, R*1.55, R*1.55], [-R*1.14, R*1.65+0.32, 0], redMat);

[-R*0.82, R*0.82].forEach(z =>
  addCylinder(carVisual, R*0.08, R*0.08, R*1.95,
    [-R*0.82, R*1.72+0.32, z], [0, 0, 0], metalMat, 12));

addSphere(carVisual, R*0.72, [R*0.72, R*0.92+0.32, 0], [1.25, 0.46, 0.95], redMat);
addSphere(carVisual, R*0.56, [-R*0.10, R*1.20+0.32, 0], [0.95, 0.34, 0.78], glassMat);

// ── wheels ────────────────────────────────────────────────────────────────────
const wheelMeshes = [];
const wheelRadius = R * 0.70;
const wheelWidth  = R * 0.52;
const wR_ = wheelRadius; // alias used by tick() for spin rate
const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 18);

[
  [ R*0.85, wheelRadius+0.10,  R*1.22],
  [ R*0.85, wheelRadius+0.10, -R*1.22],
  [-R*1.05, wheelRadius+0.10,  R*1.22],
  [-R*1.05, wheelRadius+0.10, -R*1.22],
].forEach(([wx, wy, wz]) => {
  const wheel = new THREE.Mesh(wheelGeo, tireMat);
  wheel.rotation.x = Math.PI / 2;
  wheel.position.set(wx, wy, wz);
  wheel.castShadow = true; wheel.receiveShadow = true;
  carVisual.add(wheel);
  wheelMeshes.push(wheel);

  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(wheelRadius*0.42, wheelRadius*0.42, wheelWidth*1.05, 14),
    metalMat
  );
  hub.rotation.x = Math.PI / 2;
  hub.position.copy(wheel.position);
  hub.castShadow = true;
  carVisual.add(hub);
});


// ── spawn ─────────────────────────────────────────────────────────────────────
const {x:sx, z:sz} = tileCenter(HALF_W, HALF_H);
carGroup.position.set(sx, 0, sz);

// ─── particles ───────────────────────────────────────────────────────────────
const PCOUNT=60, SCOUNT=35;
const pebbleGeo = new THREE.DodecahedronGeometry(0.24,0);
const smokeGeo  = new THREE.SphereGeometry(0.42,6,5);
const pebbleMat = new THREE.MeshToonMaterial({color:0x998866});

const pebbleMeshes = Array.from({length:PCOUNT},()=>{
  const m=new THREE.Mesh(pebbleGeo,pebbleMat); m.visible=false; scene.add(m); return m;
});
const smokeMeshes = Array.from({length:SCOUNT},()=>{
  const m=new THREE.Mesh(smokeGeo,
    new THREE.MeshBasicMaterial({color:0xddddcc,transparent:true,opacity:0}));
  m.visible=false; scene.add(m); return m;
});

const pData = Array.from({length:PCOUNT},()=>({active:false,vx:0,vy:0,vz:0,life:0,maxLife:0.6}));
const sData = Array.from({length:SCOUNT},()=>({active:false,vx:0,vy:0,vz:0,life:0,maxLife:1.0}));
let pHead=0, sHead=0;

function spawnEffects(x,z,fwX,fwZ,spd){
  if(spd<5)return;
  const px=-fwZ, pz=fwX; // perpendicular (local +Z in world)
  const rCX=x-fwX*R*1.05, rCZ=z-fwZ*R*1.05;

  // rear-right and rear-left wheel world positions
  const wpos=[
    [rCX+px*R*1.22, rCZ+pz*R*1.22],
    [rCX-px*R*1.22, rCZ-pz*R*1.22],
  ];

  for(const [wx,wz] of wpos){
    const idx=pHead%PCOUNT; pHead++;
    const p=pData[idx], m=pebbleMeshes[idx];
    const lat=(Math.random()-0.5)*2.5;
    const bs=4+Math.random()*10;
    p.active=true;
    p.vx=-fwX*bs+px*lat; p.vy=4+Math.random()*12; p.vz=-fwZ*bs+pz*lat;
    p.life=1.0; p.maxLife=0.35+Math.random()*0.3;
    m.position.set(wx+(Math.random()-0.5)*0.5, 0.3, wz+(Math.random()-0.5)*0.5);
    m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    m.visible=true;
  }

  // smoke from car body center
  const sidx=sHead%SCOUNT; sHead++;
  const s=sData[sidx], sm=smokeMeshes[sidx];
  s.active=true;
  s.vx=(Math.random()-0.5)*0.6; s.vy=0.6+Math.random()*1.0; s.vz=(Math.random()-0.5)*0.6;
  s.life=1.0; s.maxLife=0.8+Math.random()*0.4;
  sm.position.set(x,1.2,z); sm.scale.setScalar(0.9);
  sm.material.opacity=0.42; sm.visible=true;
}

function updateParticles(dt){
  for(let i=0;i<PCOUNT;i++){
    const p=pData[i]; if(!p.active)continue;
    p.life-=dt/p.maxLife;
    if(p.life<=0){p.active=false;pebbleMeshes[i].visible=false;continue;}
    const m=pebbleMeshes[i];
    m.position.x+=p.vx*dt; m.position.y+=p.vy*dt; m.position.z+=p.vz*dt;
    p.vy-=22*dt;
    m.rotation.x+=p.vx*dt*3; m.rotation.z+=p.vz*dt*3;
    if(m.position.y<0.15){
      m.position.y=0.15; p.vy*=-0.25; p.vx*=0.55; p.vz*=0.55;
    }
  }
  for(let i=0;i<SCOUNT;i++){
    const s=sData[i]; if(!s.active)continue;
    s.life-=dt/s.maxLife;
    if(s.life<=0){s.active=false;smokeMeshes[i].visible=false;continue;}
    const m=smokeMeshes[i];
    m.position.x+=s.vx*dt; m.position.y+=s.vy*dt; m.position.z+=s.vz*dt;
    m.scale.setScalar(1+(1-s.life)*3);
    m.material.opacity=s.life*0.48;
  }
}

// ─── physics ─────────────────────────────────────────────────────────────────
const CONST_SPEED = 55; // always-on constant speed (world units/s)

const CAR_HL = TILE*0.48;
const CAR_HW = TILE*0.34;

let particleTimer=0;
let wheelAngle=0;

// Always-moving direction (world cardinal unit vector)
let dirX = 0, dirZ = -1;          // start heading "up" (-Z = top of screen)
let prevDirX = 0, prevDirZ = -1;  // direction before last turn (momentum preference)
let turnBias = 1;                  // +1 = try right first, -1 = left first (tie-break)
let stuckTimer = 0;               // time (s) spent unable to move forward

let targetRotY = Math.atan2(-dirZ, dirX);
const ROT_SPEED = 18;

// ─── keyboard ────────────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// ─── sensor ──────────────────────────────────────────────────────────────────
let rawBeta=0,rawGamma=0,baseBeta=0,baseGamma=0;
let sensorOk=false, gameOn=false;
window.addEventListener('deviceorientation',e=>{rawBeta=e.beta??0;rawGamma=e.gamma??0;});

async function reqSensor(){
  if(typeof DeviceOrientationEvent?.requestPermission==='function'){
    const r=await DeviceOrientationEvent.requestPermission();
    return r==='granted';
  }
  return true;
}
function calibrate(){baseBeta=rawBeta;baseGamma=rawGamma;sensorOk=true;}

// ─── ui ──────────────────────────────────────────────────────────────────────
const overlay  = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hud      = document.getElementById('hud');
const recalBtn = document.getElementById('recalBtn');

startBtn.addEventListener('click',async()=>{
  const ok=await reqSensor();
  if(!ok){alert('센서 권한이 필요합니다.');return;}
  calibrate();
  overlay.style.display='none'; hud.style.display='block'; recalBtn.style.display='block';
  gameOn=true;
});
recalBtn.addEventListener('click',calibrate);

// ─── resize ──────────────────────────────────────────────────────────────────
function onResize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);
onResize();

// ─── camera (position-slide perspective top view) ────────────────────────────
const CAM_H=175;
const BASE_CAMERA_UP = new THREE.Vector3(0,0,-1);
const CAMERA_POS_LEAD = 18;
const cameraLead = new THREE.Vector3();
const targetCameraLead = new THREE.Vector3();
const ZERO_CAMERA_LEAD = new THREE.Vector3();
function setTopCamera(x,z){
  camera.position.set(x+cameraLead.x,CAM_H,z+cameraLead.z);
  camera.up.copy(BASE_CAMERA_UP);
  camera.lookAt(x,0,z);
}
setTopCamera(sx,sz);

// ─── helpers ─────────────────────────────────────────────────────────────────
// Collision box aligned to movement direction (ndX,ndZ), not visual facing
function cornersForDir(px,pz,ndX,ndZ){
  const rpX=-ndZ, rpZ=ndX;
  return[
    [px+ndX*CAR_HL+rpX*CAR_HW, pz+ndZ*CAR_HL+rpZ*CAR_HW],
    [px+ndX*CAR_HL-rpX*CAR_HW, pz+ndZ*CAR_HL-rpZ*CAR_HW],
    [px-ndX*CAR_HL+rpX*CAR_HW, pz-ndZ*CAR_HL+rpZ*CAR_HW],
    [px-ndX*CAR_HL-rpX*CAR_HW, pz-ndZ*CAR_HL-rpZ*CAR_HW],
  ];
}
function leadingPointsForDir(px,pz,ndX,ndZ){
  const rpX=-ndZ, rpZ=ndX;
  const noseX=px+ndX*CAR_HL, noseZ=pz+ndZ*CAR_HL;
  return[
    [noseX+rpX*CAR_HW, noseZ+rpZ*CAR_HW],
    [noseX-rpX*CAR_HW, noseZ-rpZ*CAR_HW],
    [noseX, noseZ],
  ];
}
function blockedCornersForDir(px,pz,ndX,ndZ){
  return cornersForDir(px,pz,ndX,ndZ).filter(([cx,cz])=>!passable(cx,cz));
}
function clearForDir(px,pz,ndX,ndZ){
  return blockedCornersForDir(px,pz,ndX,ndZ).length===0;
}
function leadingClearForDir(px,pz,ndX,ndZ){
  return leadingPointsForDir(px,pz,ndX,ndZ).every(([cx,cz])=>passable(cx,cz));
}
function canMoveToward(px,pz,nx,nz,ndX,ndZ){
  if(clearForDir(nx,nz,ndX,ndZ))return true;
  const currentHits=blockedCornersForDir(px,pz,ndX,ndZ).length;
  const nextHits=blockedCornersForDir(nx,nz,ndX,ndZ).length;
  return currentHits>0&&nextHits<=currentHits&&leadingClearForDir(nx,nz,ndX,ndZ);
}
function pushFromWalls(px,pz,ndX,ndZ,dt){
  const hits=blockedCornersForDir(px,pz,ndX,ndZ);
  if(hits.length===0)return {x:px,z:pz};

  let pushX=0, pushZ=0;
  hits.forEach(([cx,cz])=>{
    pushX+=px-cx;
    pushZ+=pz-cz;
  });
  const len=Math.hypot(pushX,pushZ);
  if(len<0.001)return {x:px,z:pz};

  const step=Math.min(TILE*0.22, CONST_SPEED*dt*0.85);
  const ux=pushX/len, uz=pushZ/len;
  for(const mul of [1,0.6,0.35]){
    const tx=px+ux*step*mul;
    const tz=pz+uz*step*mul;
    if(clearForDir(tx,tz,ndX,ndZ))return {x:tx,z:tz};
    const nextHits=blockedCornersForDir(tx,tz,ndX,ndZ).length;
    if(nextHits<=hits.length&&leadingClearForDir(tx,tz,ndX,ndZ))
      return {x:tx,z:tz};
  }
  return {x:px,z:pz};
}
function moveWithCollision(px,pz,ndX,ndZ,dt){
  const spd=CONST_SPEED*dt;
  const rpX=-ndZ, rpZ=ndX;
  const nx=px+ndX*spd, nz=pz+ndZ*spd;

  // Fully clear — move straight
  if(clearForDir(nx,nz,ndX,ndZ))
    return {x:nx,z:nz,moved:true};

  // Alignment assist: nudge perpendicular in small steps to slip past corner obstacles.
  // Only allowed when the current position can also shift laterally (no wall beside us).
  for(let n=TILE*0.08; n<=TILE*0.42; n+=TILE*0.08){
    for(const s of [1,-1]){
      const nnx=nx+rpX*s*n, nnz=nz+rpZ*s*n;
      if(clearForDir(nnx,nnz,ndX,ndZ) && passable(px+rpX*s*n, pz+rpZ*s*n))
        return {x:nnx,z:nnz,moved:true};
    }
  }

  // Wall slide: fewer blocked corners + leading edge still open
  if(canMoveToward(px,pz,nx,nz,ndX,ndZ)){
    const pushed=pushFromWalls(nx,nz,ndX,ndZ,dt);
    return {x:pushed.x,z:pushed.z,moved:true};
  }

  return {x:px,z:pz,moved:false};
}

// ─── loop ────────────────────────────────────────────────────────────────────
let last=performance.now();

function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  const dt=Math.min((now-last)/1000,0.05);
  last=now;

  if(gameOn&&sensorOk){
    // ── player steers: key/tilt = desired direction, accepted only if passable ─
    let wantX=0, wantZ=0;
    if     (keys['ArrowUp']   ||keys['KeyW']) { wantX=0;  wantZ=-1; }
    else if(keys['ArrowDown'] ||keys['KeyS']) { wantX=0;  wantZ=1;  }
    else if(keys['ArrowRight']||keys['KeyD']) { wantX=1;  wantZ=0;  }
    else if(keys['ArrowLeft'] ||keys['KeyA']) { wantX=-1; wantZ=0;  }

    // Sensor: dominant tilt axis (only when no key pressed)
    if(wantX===0&&wantZ===0){
      const tiltFwd  = rawBeta  - baseBeta;
      const tiltSide = rawGamma - baseGamma;
      const FD=8;
      if(Math.abs(tiltFwd)>Math.abs(tiltSide)){
        if(tiltFwd<-FD) { wantX=0; wantZ=-1; }
        else if(tiltFwd>FD) { wantX=0; wantZ=1; }
      }else{
        if(tiltSide<-FD) { wantX=-1; wantZ=0; }
        else if(tiltSide>FD) { wantX=1; wantZ=0; }
      }
    }

    // Apply player steer when the new direction's leading edge is clear
    if((wantX!==0||wantZ!==0)&&(wantX!==dirX||wantZ!==dirZ)){
      const wnx=carGroup.position.x+wantX*CONST_SPEED*dt;
      const wnz=carGroup.position.z+wantZ*CONST_SPEED*dt;
      if(leadingClearForDir(wnx,wnz,wantX,wantZ)){
        prevDirX=dirX; prevDirZ=dirZ;
        dirX=wantX; dirZ=wantZ;
        stuckTimer=0;
      }
    }

    // ── always move; auto-turn on wall hit ───────────────────────────────────
    const move=moveWithCollision(carGroup.position.x,carGroup.position.z,dirX,dirZ,dt);

    if(move.moved){
      carGroup.position.x=move.x;
      carGroup.position.z=move.z;
      stuckTimer=0;
    }else{
      stuckTimer+=dt;

      const rX=-dirZ, rZ=dirX, lX=dirZ, lZ=-dirX, bX=-dirX, bZ=-dirZ;

      // prevDir is useful only when it isn't current dir or its reverse
      const prevIsUseful=(prevDirX!==dirX||prevDirZ!==dirZ)
                        &&(prevDirX!==bX   ||prevDirZ!==bZ);

      let tries;
      if(stuckTimer>0.4){
        // Stuck in dead-end (ㄷ-shape etc): force reverse to break the loop
        tries=[[bX,bZ],[rX,rZ],[lX,lZ]];
        stuckTimer=0;
      }else if(prevIsUseful){
        // Natural momentum: prefer the direction we came from before the last turn
        const sides=turnBias>0?[[rX,rZ],[lX,lZ]]:[[lX,lZ],[rX,rZ]];
        tries=[[prevDirX,prevDirZ],...sides,[bX,bZ]];
      }else{
        tries=turnBias>0?[[rX,rZ],[lX,lZ],[bX,bZ]]:[[lX,lZ],[rX,rZ],[bX,bZ]];
      }

      for(const [tx,tz] of tries){
        const tnx=carGroup.position.x+tx*CONST_SPEED*dt;
        const tnz=carGroup.position.z+tz*CONST_SPEED*dt;
        if(leadingClearForDir(tnx,tnz,tx,tz)){
          const turnMove=moveWithCollision(carGroup.position.x,carGroup.position.z,tx,tz,dt);
          if(!turnMove.moved)continue;
          prevDirX=dirX; prevDirZ=dirZ;
          dirX=tx; dirZ=tz;
          carGroup.position.x=turnMove.x;
          carGroup.position.z=turnMove.z;
          turnBias*=-1;
          stuckTimer=0;
          break;
        }
      }
    }

    // ── visual rotation toward current direction ──────────────────────────────
    targetRotY=Math.atan2(-dirZ, dirX);
    let diff=targetRotY-carGroup.rotation.y;
    while(diff>Math.PI)  diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    carGroup.rotation.y+=Math.sign(diff)*Math.min(Math.abs(diff), ROT_SPEED*dt);

    // ── wheel spin ────────────────────────────────────────────────────────────
    wheelAngle-=CONST_SPEED*dt/wR_;
    wheelMeshes.forEach(w=>w.rotation.y=wheelAngle);

    // ── particles ─────────────────────────────────────────────────────────────
    particleTimer+=dt;
    if(particleTimer>0.055){
      particleTimer=0;
      spawnEffects(carGroup.position.x,carGroup.position.z,dirX,dirZ,CONST_SPEED);
    }
    updateParticles(dt);

    // ── position-slide perspective top-view camera ────────────────────────────
    const tgtX=carGroup.position.x;
    const tgtZ=carGroup.position.z;
    targetCameraLead.set(-dirX*CAMERA_POS_LEAD,0,-dirZ*CAMERA_POS_LEAD);
    cameraLead.lerp(targetCameraLead, 1-Math.exp(-2.4*dt));
    setTopCamera(tgtX,tgtZ);

    // ── hud ───────────────────────────────────────────────────────────────────
    const dirArrow=dirX>0?'→':dirX<0?'←':dirZ<0?'↑':'↓';
    hud.textContent=`${dirArrow} ${(CONST_SPEED*3.6).toFixed(0)} km/h`;

  }else if(!gameOn){
    cameraLead.lerp(ZERO_CAMERA_LEAD, 1-Math.exp(-2.4*dt));
    setTopCamera(sx,sz);
  }

  renderer.render(scene,camera);
}

tick();
</script>
