<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>City Car</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:system-ui,sans-serif;touch-action:none}
  #c{display:block;width:100%;height:100%}

  #overlay{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.78);z-index:20;
  }
  #overlay h1{
    color:#ffd400;font-size:clamp(2rem,7vw,4rem);
    font-weight:900;letter-spacing:4px;margin-bottom:10px;text-shadow:0 2px 20px rgba(255,212,0,.5);
  }
  #overlay p{
    color:#aaa;font-size:clamp(.8rem,2.5vw,.95rem);
    margin-bottom:36px;text-align:center;max-width:300px;line-height:1.8;
  }
  #startBtn{
    padding:16px 56px;border:none;border-radius:999px;
    font-size:clamp(1rem,3vw,1.25rem);font-weight:800;
    background:#ffd400;color:#111;cursor:pointer;
    box-shadow:0 4px 28px rgba(255,212,0,.45);
    transition:transform .1s,box-shadow .1s;
  }
  #startBtn:active{transform:scale(.95);box-shadow:0 2px 14px rgba(255,212,0,.3)}

  #hud{
    position:fixed;top:12px;right:12px;
    color:#fff;background:rgba(0,0,0,.6);
    padding:8px 14px;border-radius:10px;
    font-size:13px;line-height:1.8;white-space:pre;
    z-index:10;display:none;font-variant-numeric:tabular-nums;
  }
  #recalBtn{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    padding:12px 28px;border:none;border-radius:999px;
    font-size:14px;font-weight:700;
    background:rgba(255,212,0,.92);color:#111;
    cursor:pointer;z-index:10;display:none;
    box-shadow:0 2px 12px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="overlay">
  <h1>CITY CAR</h1>
  <p>기기를 앞뒤로 기울여 가속/감속,<br>좌우로 기울여 조향하세요.<br>데스크탑에서는 방향키(↑↓←→) 또는 WASD로 조종할 수 있습니다.<br><br>모바일 시작 시 센서 접근 허용이 필요합니다.</p>
  <button id="startBtn">GAME START</button>
</div>
<div id="hud"></div>
<button id="recalBtn">리캘리브레이션</button>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ─── constants ───────────────────────────────────────────────────────────────
const TILE    = 12;        // world units per tile (≈1 car length)
const MAP_W   = 128;
const MAP_H   = 128;
const HALF_W  = MAP_W / 2;
const HALF_H  = MAP_H / 2;
const T = { ROAD:0, BUILDING:1, PARK:2, WATER:3, BRIDGE:4 };

// ─── deterministic rng ───────────────────────────────────────────────────────
let _s = 0xdeadbeef;
function rng() {
  _s = Math.imul(_s ^ (_s >>> 16), 0x45d9f3b);
  _s = Math.imul(_s ^ (_s >>> 16), 0x45d9f3b);
  _s ^= _s >>> 16;
  return (_s >>> 0) / 0xffffffff;
}

// ─── map ─────────────────────────────────────────────────────────────────────
const tileMap  = new Uint8Array(MAP_W * MAP_H).fill(T.BUILDING);
const waterMrk = new Uint8Array(MAP_W * MAP_H);
const bldgH    = new Uint8Array(MAP_W * MAP_H);

function mi(x, y)  { return y * MAP_W + x; }

function fillRect(x0, y0, w, h, val, buf = tileMap) {
  for (let dy = 0; dy < h; dy++)
    for (let dx = 0; dx < w; dx++) {
      const x = x0+dx, y = y0+dy;
      if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H)
        buf[mi(x, y)] = val;
    }
}

function buildMap() {
  // Water rivers
  for (let i = 0; i < 5; i++) {
    const horiz = rng() < 0.5;
    if (horiz) {
      const wy = 12 + Math.floor(rng() * (MAP_H - 24));
      const ww = 2 + Math.floor(rng() * 3);
      fillRect(0, wy, MAP_W, ww, T.WATER);
      fillRect(0, wy, MAP_W, ww, 1, waterMrk);
    } else {
      const wx = 12 + Math.floor(rng() * (MAP_W - 24));
      const ww = 2 + Math.floor(rng() * 3);
      fillRect(wx, 0, ww, MAP_H, T.WATER);
      fillRect(wx, 0, ww, MAP_H, 1, waterMrk);
    }
  }

  // Horizontal roads
  for (let y = 6; y < MAP_H - 6; ) {
    const w = [1,1,2,2,2,3,4][Math.floor(rng()*7)];
    fillRect(0, y, MAP_W, w, T.ROAD);
    y += 6 + Math.floor(rng() * 14);
  }
  // Vertical roads
  for (let x = 6; x < MAP_W - 6; ) {
    const w = [1,1,2,2,2,3,4][Math.floor(rng()*7)];
    fillRect(x, 0, w, MAP_H, T.ROAD);
    x += 6 + Math.floor(rng() * 14);
  }

  // Guaranteed cross at center
  fillRect(HALF_W-1, 0, 3, MAP_H, T.ROAD);
  fillRect(0, HALF_H-1, MAP_W, 3, T.ROAD);

  // Bridges where road meets water
  for (let i = 0; i < MAP_W * MAP_H; i++)
    if (tileMap[i] === T.ROAD && waterMrk[i]) tileMap[i] = T.BRIDGE;

  // Parks
  for (let i = 0; i < 20; i++) {
    const px = 4 + Math.floor(rng() * (MAP_W - 14));
    const py = 4 + Math.floor(rng() * (MAP_H - 14));
    const pw = 3 + Math.floor(rng() * 8);
    const ph = 3 + Math.floor(rng() * 8);
    let ok = true;
    loop: for (let dy = 0; dy < ph; dy++)
      for (let dx = 0; dx < pw; dx++)
        if (tileMap[mi(px+dx, py+dy)] !== T.BUILDING) { ok = false; break loop; }
    if (ok) fillRect(px, py, pw, ph, T.PARK);
  }

  // Large landmark buildings (uniform tall footprints)
  for (let i = 0; i < 30; i++) {
    const bx = 4 + Math.floor(rng() * (MAP_W - 14));
    const by = 4 + Math.floor(rng() * (MAP_H - 14));
    const bw = 3 + Math.floor(rng() * 5);
    const bh = 3 + Math.floor(rng() * 5);
    const ht = 6 + Math.floor(rng() * 5);
    let ok = true;
    loop: for (let dy = 0; dy < bh; dy++)
      for (let dx = 0; dx < bw; dx++)
        if (tileMap[mi(bx+dx, by+dy)] !== T.BUILDING) { ok = false; break loop; }
    if (ok)
      for (let dy = 0; dy < bh; dy++)
        for (let dx = 0; dx < bw; dx++)
          bldgH[mi(bx+dx, by+dy)] = ht;
  }

  // Random building heights
  for (let i = 0; i < MAP_W * MAP_H; i++)
    if (tileMap[i] === T.BUILDING && bldgH[i] === 0)
      bldgH[i] = 1 + Math.floor(rng() * 7);
}

buildMap();

// ─── coord helpers ───────────────────────────────────────────────────────────
function tileCenter(tx, ty) {
  return { x: (tx - HALF_W + 0.5) * TILE, z: (ty - HALF_H + 0.5) * TILE };
}
function tileAt(wx, wz) {
  const tx = Math.floor(wx / TILE + HALF_W);
  const ty = Math.floor(wz / TILE + HALF_H);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return T.BUILDING;
  return tileMap[mi(tx, ty)];
}
function passable(wx, wz) {
  const t = tileAt(wx, wz);
  return t === T.ROAD || t === T.BRIDGE;
}

// ─── renderer ────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 280, 520);

const camera = new THREE.PerspectiveCamera(48, 1, 1, 700);

// ─── lighting ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x99aabb, 0.7));
scene.add(new THREE.HemisphereLight(0x334466, 0x223322, 0.5));

const sun = new THREE.DirectionalLight(0xfff5cc, 1.3);
sun.position.set(120, 220, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-220, right:220, top:220, bottom:-220, near:1, far:800 });
scene.add(sun);

// ─── instanced scene geometry ─────────────────────────────────────────────────
const cnt = new Array(5).fill(0);
for (let i = 0; i < MAP_W * MAP_H; i++) cnt[tileMap[i]]++;

const flatGeo  = new THREE.BoxGeometry(TILE, 0.5, TILE);
const bldgBase = new THREE.BoxGeometry(TILE * 0.84, 1, TILE * 0.84);

const matRoad   = new THREE.MeshLambertMaterial({ color: 0x38384a });
const matBridge = new THREE.MeshLambertMaterial({ color: 0x6b5a3e });
const matPark   = new THREE.MeshLambertMaterial({ color: 0x2d5a27 });
const matWater  = new THREE.MeshLambertMaterial({ color: 0x1a3a5c });

const BLDG_COLORS = [0x4a5568, 0x2d3748, 0x55395a, 0x2a4a3a, 0x4a3a2a, 0x3a4a6a];
const bldgCnt = new Array(6).fill(0);
for (let i = 0; i < MAP_W * MAP_H; i++)
  if (tileMap[i] === T.BUILDING) bldgCnt[i % 6]++;

function iMesh(geo, mat, n) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, n));
  m.castShadow = m.receiveShadow = true;
  scene.add(m); return m;
}

const mRoad   = iMesh(flatGeo,  matRoad,   cnt[T.ROAD]);
const mBridge = iMesh(flatGeo,  matBridge, cnt[T.BRIDGE]);
const mPark   = iMesh(flatGeo,  matPark,   cnt[T.PARK]);
const mWater  = iMesh(flatGeo,  matWater,  cnt[T.WATER]);
const mBldgs  = BLDG_COLORS.map((c, i) =>
  iMesh(bldgBase, new THREE.MeshLambertMaterial({ color: c }), bldgCnt[i])
);

// Ground
const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(MAP_W * TILE, MAP_H * TILE),
  new THREE.MeshLambertMaterial({ color: 0x1a1a28 })
);
gnd.rotation.x = -Math.PI / 2;
gnd.position.y = -0.1;
gnd.receiveShadow = true;
scene.add(gnd);

const D = new THREE.Object3D();
const bi = [0,0,0,0,0,0];
let ri=0, bri=0, pi=0, wi=0;

for (let ty = 0; ty < MAP_H; ty++) {
  for (let tx = 0; tx < MAP_W; tx++) {
    const id = mi(tx, ty);
    const tp = tileMap[id];
    const {x, z} = tileCenter(tx, ty);
    D.rotation.set(0, 0, 0);

    if (tp === T.ROAD) {
      D.position.set(x, 0.25, z); D.scale.set(1,1,1); D.updateMatrix();
      mRoad.setMatrixAt(ri++, D.matrix);
    } else if (tp === T.BRIDGE) {
      D.position.set(x, 0.25, z); D.scale.set(1,1,1); D.updateMatrix();
      mBridge.setMatrixAt(bri++, D.matrix);
    } else if (tp === T.PARK) {
      D.position.set(x, 0.2, z); D.scale.set(1,1,1); D.updateMatrix();
      mPark.setMatrixAt(pi++, D.matrix);
    } else if (tp === T.WATER) {
      D.position.set(x, -0.15, z); D.scale.set(1,1,1); D.updateMatrix();
      mWater.setMatrixAt(wi++, D.matrix);
    } else if (tp === T.BUILDING) {
      const ci = id % 6;
      const h  = Math.max(1, bldgH[id]);
      const bh = h * TILE * 0.55;
      D.position.set(x, bh/2 + 0.4, z);
      D.scale.set(1, bh, 1); D.updateMatrix();
      mBldgs[ci].setMatrixAt(bi[ci]++, D.matrix);
    }
  }
}

[mRoad, mBridge, mPark, mWater, ...mBldgs].forEach(m => {
  m.instanceMatrix.needsUpdate = true;
});

// Road lane markers (dashes on wide roads) — center-line planes
const dashGeo = new THREE.PlaneGeometry(TILE * 0.06, TILE * 0.3);
const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.35, transparent: true });
const dashPositions = [];
for (let ty = 0; ty < MAP_H; ty++) {
  for (let tx = 0; tx < MAP_W; tx++) {
    if (tileMap[mi(tx, ty)] !== T.ROAD) continue;
    // only place dash if both neighbors same type (middle of a road stretch)
    if (tx > 0 && tx < MAP_W-1 &&
        tileMap[mi(tx-1, ty)] === T.ROAD &&
        tileMap[mi(tx+1, ty)] === T.ROAD &&
        ty > 0 && tileMap[mi(tx, ty-1)] !== T.ROAD) {
      dashPositions.push(tileCenter(tx, ty));
    }
  }
}
if (dashPositions.length > 0) {
  const dm = new THREE.InstancedMesh(dashGeo, dashMat, dashPositions.length);
  dashPositions.forEach(({x,z}, i) => {
    D.rotation.set(-Math.PI/2, 0, 0);
    D.position.set(x, 0.52, z);
    D.scale.set(1,1,1);
    D.updateMatrix();
    dm.setMatrixAt(i, D.matrix);
  });
  dm.instanceMatrix.needsUpdate = true;
  scene.add(dm);
}

// ─── car ─────────────────────────────────────────────────────────────────────
const carGroup = new THREE.Group();
scene.add(carGroup);

const yMat  = new THREE.MeshLambertMaterial({ color: 0xffd400 });
const wMat  = new THREE.MeshLambertMaterial({ color: 0x111111 });
const glMat = new THREE.MeshLambertMaterial({ color: 0xc8e8ff, transparent:true, opacity:.75 });

// Body
const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*.65, TILE*.22, TILE*.4), yMat);
body.position.y = TILE*.11 + .4;
body.castShadow = true;
carGroup.add(body);

// Cabin
const cab = new THREE.Mesh(new THREE.BoxGeometry(TILE*.3, TILE*.18, TILE*.35), glMat);
cab.position.set(TILE*.04, TILE*.24 + .4, 0);
cab.castShadow = true;
carGroup.add(cab);

// Wheels
const wGeo = new THREE.CylinderGeometry(TILE*.08, TILE*.08, TILE*.07, 12);
[[ TILE*.27, .4,  TILE*.22],
 [ TILE*.27, .4, -TILE*.22],
 [-TILE*.27, .4,  TILE*.22],
 [-TILE*.27, .4, -TILE*.22]].forEach(([wx,wy,wz]) => {
  const w = new THREE.Mesh(wGeo, wMat);
  w.rotation.x = Math.PI/2; w.position.set(wx,wy,wz);
  w.castShadow = true; carGroup.add(w);
});

// Headlights
const hlGeo = new THREE.BoxGeometry(TILE*.05, TILE*.05, TILE*.04);
const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
[-TILE*.14, TILE*.14].forEach(tz => {
  const hl = new THREE.Mesh(hlGeo, hlMat);
  hl.position.set(TILE*.33, TILE*.13+.4, tz);
  carGroup.add(hl);
});

// Tail lights
const tlMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
[-TILE*.14, TILE*.14].forEach(tz => {
  const tl = new THREE.Mesh(new THREE.BoxGeometry(TILE*.04, TILE*.05, TILE*.04), tlMat);
  tl.position.set(-TILE*.33, TILE*.13+.4, tz);
  carGroup.add(tl);
});

const { x: sx, z: sz } = tileCenter(HALF_W, HALF_H);
carGroup.position.set(sx, 0, sz);

// ─── physics ─────────────────────────────────────────────────────────────────
let speed     = 0;
const MAX_FWD = 22;   // m/s ≈ 79 km/h
const MAX_REV = 8;
const ACCEL   = 12;
const DRAG    = 1.8;  // exponential drag coefficient
const BOUNCE  = 0.32;

const CAR_HL = TILE * 0.33; // half-length collision
const CAR_HW = TILE * 0.20; // half-width collision

// ─── keyboard ────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── sensor ──────────────────────────────────────────────────────────────────
let rawBeta=0, rawGamma=0, baseBeta=0, baseGamma=0;
let sensorOk = false, gameOn = false;

window.addEventListener('deviceorientation', e => {
  rawBeta  = e.beta  ?? 0;
  rawGamma = e.gamma ?? 0;
});

async function reqSensor() {
  if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
    const r = await DeviceOrientationEvent.requestPermission();
    return r === 'granted';
  }
  return true;
}
function calibrate() { baseBeta = rawBeta; baseGamma = rawGamma; sensorOk = true; }

// ─── ui ──────────────────────────────────────────────────────────────────────
const overlay  = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hud      = document.getElementById('hud');
const recalBtn = document.getElementById('recalBtn');

startBtn.addEventListener('click', async () => {
  const ok = await reqSensor();
  if (!ok) { alert('센서 권한이 필요합니다.'); return; }
  calibrate();
  overlay.style.display  = 'none';
  hud.style.display      = 'block';
  recalBtn.style.display = 'block';
  gameOn = true;
});
recalBtn.addEventListener('click', calibrate);

// ─── resize ──────────────────────────────────────────────────────────────────
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ─── camera ──────────────────────────────────────────────────────────────────
const CAM_H       = 88;   // height above ground
const CAM_BEHIND  = 38;   // world units behind car
const CAM_LOOK_FW = 14;   // look-at offset ahead of car
const CAM_LERP    = 0.055;

// Init camera at center looking down
camera.position.set(sx, CAM_H, sz + CAM_BEHIND);
camera.lookAt(sx, 0, sz - CAM_LOOK_FW);

// ─── loop ────────────────────────────────────────────────────────────────────
let last = performance.now();

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt  = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (gameOn && sensorOk) {
    // Keyboard: each direction key = 20° equivalent tilt, diagonals work naturally
    const KB = 20;
    const kbFwd  = (keys['ArrowUp']   || keys['KeyW'] ? KB : 0)
                 - (keys['ArrowDown'] || keys['KeyS'] ? KB : 0);
    const kbSide = (keys['ArrowRight']|| keys['KeyD'] ? KB : 0)
                 - (keys['ArrowLeft'] || keys['KeyA'] ? KB : 0);

    // Merge sensor + keyboard (on desktop sensor stays 0, keyboard takes over)
    const tiltFwd  = (rawBeta  - baseBeta)  + kbFwd;
    const tiltSide = (rawGamma - baseGamma) + kbSide;

    // Throttle from forward tilt
    const FD = 3, SD = 3;
    let throttle = 0;
    if (tiltFwd >  FD) throttle =  (tiltFwd  - FD) / 22;
    if (tiltFwd < -FD) throttle = -((-tiltFwd) - FD) / 32;
    throttle = Math.max(-0.5, Math.min(1, throttle));

    speed += throttle * ACCEL * dt;
    speed *= Math.exp(-DRAG * dt);
    speed  = Math.max(-MAX_REV, Math.min(MAX_FWD, speed));

    // Steering — only effective when moving
    if (Math.abs(speed) > 0.4) {
      let steer = 0;
      if (Math.abs(tiltSide) > SD)
        steer = (tiltSide - Math.sign(tiltSide) * SD) / 35;
      steer = Math.max(-1, Math.min(1, steer));
      const grip = Math.min(1, Math.abs(speed) / 6);
      carGroup.rotation.y -= steer * Math.sign(speed) * 1.8 * grip * dt;
    }

    // Forward direction from car rotation
    const ry  = carGroup.rotation.y;
    const fwX = Math.sin(ry), fwZ = Math.cos(ry);
    const rtX = Math.cos(ry), rtZ = -Math.sin(ry);

    const nx = carGroup.position.x + fwX * speed * dt;
    const nz = carGroup.position.z + fwZ * speed * dt;

    // 4-corner collision
    const corners = [
      [nx + rtX*CAR_HW + fwX*CAR_HL, nz + rtZ*CAR_HW + fwZ*CAR_HL],
      [nx - rtX*CAR_HW + fwX*CAR_HL, nz - rtZ*CAR_HW + fwZ*CAR_HL],
      [nx + rtX*CAR_HW - fwX*CAR_HL, nz + rtZ*CAR_HW - fwZ*CAR_HL],
      [nx - rtX*CAR_HW - fwX*CAR_HL, nz - rtZ*CAR_HW - fwZ*CAR_HL],
    ];

    const hit = corners.some(([cx,cz]) => !passable(cx, cz));

    if (hit) {
      speed *= -BOUNCE;
      carGroup.rotation.y += (Math.random() - 0.5) * 0.25;
    } else {
      carGroup.position.x = nx;
      carGroup.position.z = nz;
    }

    // Camera follows behind car
    const tgtX = carGroup.position.x - fwX * CAM_BEHIND;
    const tgtZ = carGroup.position.z - fwZ * CAM_BEHIND;
    const lkX  = carGroup.position.x + fwX * CAM_LOOK_FW;
    const lkZ  = carGroup.position.z + fwZ * CAM_LOOK_FW;

    camera.position.x += (tgtX - camera.position.x) * CAM_LERP * 60 * dt;
    camera.position.y  = CAM_H;
    camera.position.z += (tgtZ - camera.position.z) * CAM_LERP * 60 * dt;
    camera.lookAt(lkX, 0, lkZ);

    // HUD
    const kmh    = (Math.abs(speed) * 3.6).toFixed(0).padStart(3);
    const dir    = speed > 0.5 ? '▲' : speed < -0.5 ? '▼' : '■';
    const kbAny  = kbFwd !== 0 || kbSide !== 0;
    const inputLine = kbAny
      ? `KB ${kbFwd>0?'↑':kbFwd<0?'↓':' '} ${kbSide<0?'←':kbSide>0?'→':' '}`
      : `↕${(rawBeta-baseBeta).toFixed(1).padStart(5)}° ↔${(rawGamma-baseGamma).toFixed(1).padStart(5)}°`;
    hud.textContent = `${dir} ${kmh} km/h\n${inputLine}`;

  } else if (!gameOn) {
    // Idle orbit camera
    const t = now / 9000;
    camera.position.set(Math.sin(t)*90, 75, Math.cos(t)*90);
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
}

tick();
</script>
</body>
</html>
