<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>City Car</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif;touch-action:none}
  #c{display:block;width:100%;height:100%}
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);z-index:20;
  }
  #overlay h1{color:#ffd400;font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:4px;margin-bottom:10px;text-shadow:0 2px 20px rgba(255,212,0,.5);}
  #overlay p{color:#ccc;font-size:clamp(.8rem,2.5vw,.95rem);margin-bottom:36px;text-align:center;max-width:300px;line-height:1.8;}
  #startBtn{padding:16px 56px;border:none;border-radius:999px;font-size:clamp(1rem,3vw,1.25rem);font-weight:800;background:#ffd400;color:#111;cursor:pointer;box-shadow:0 4px 28px rgba(255,212,0,.45);transition:transform .1s,box-shadow .1s;}
  #startBtn:active{transform:scale(.95)}
  #hud{position:fixed;top:12px;right:12px;color:#fff;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:10px;font-size:14px;line-height:1.8;white-space:pre;z-index:10;display:none;font-variant-numeric:tabular-nums;}
  #recalBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 28px;border:none;border-radius:999px;font-size:14px;font-weight:700;background:rgba(255,212,0,.92);color:#111;cursor:pointer;z-index:10;display:none;box-shadow:0 2px 12px rgba(0,0,0,.4);transition:opacity .35s;}
  #recalBtn.faded{opacity:0;pointer-events:none;}
  #joystick{position:fixed;left:0;top:0;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);z-index:12;pointer-events:none;opacity:0;transition:opacity .18s;}
  #joystick.on{opacity:1;}
  #stick{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:rgba(255,212,0,.9);box-shadow:0 2px 14px rgba(0,0,0,.5);transform:translate(-50%,-50%);will-change:transform;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>CITY CAR</h1>
  <p>기기를 앞뒤·좌우로 기울여 방향을 바꾸세요.<br>화면을 0.5초 이상 누르면 가상 조이스틱이 나옵니다.<br>데스크탑: 방향키(↑↓←→) 또는 WASD<br><br>모바일 시작 시 센서 접근 허용이 필요합니다.</p>
  <button id="startBtn">GAME START</button>
</div>
<div id="hud"></div>
<button id="recalBtn">리캘리브레이션</button>
<div id="joystick"><div id="stick"></div></div>

<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

// ─── constants ───────────────────────────────────────────────────────────────
const TILE   = 12;
const MAP_W  = 128, MAP_H = 128;
const HALF_W = MAP_W/2, HALF_H = MAP_H/2;
const T = {ROAD:0, BUILDING:1, PARK:2, WATER:3, BRIDGE:4};

// ─── rng ─────────────────────────────────────────────────────────────────────
let _s = 0xdeadbeef;
function rng() {
  _s = Math.imul(_s^(_s>>>16),0x45d9f3b);
  _s = Math.imul(_s^(_s>>>16),0x45d9f3b);
  _s ^= _s>>>16;
  return (_s>>>0)/0xffffffff;
}

// ─── map ─────────────────────────────────────────────────────────────────────
const tileMap  = new Uint8Array(MAP_W*MAP_H).fill(T.BUILDING);
const waterMrk = new Uint8Array(MAP_W*MAP_H);
const bldgH    = new Uint8Array(MAP_W*MAP_H);
const bldgStyle= new Uint8Array(MAP_W*MAP_H);
const bldgW    = new Uint8Array(MAP_W*MAP_H);
const bldgD    = new Uint8Array(MAP_W*MAP_H);

function mi(x,y){return y*MAP_W+x;}
function hash2(x,y){
  let n=Math.imul(x+101,374761393)^Math.imul(y+211,668265263);
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/0xffffffff;
}
function fillRect(x0,y0,w,h,val,buf=tileMap){
  for(let dy=0;dy<h;dy++) for(let dx=0;dx<w;dx++){
    const x=x0+dx,y=y0+dy;
    if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H)buf[mi(x,y)]=val;
  }
}

function buildMap(){
  for(let i=0;i<5;i++){
    if(rng()<0.5){
      const wy=12+Math.floor(rng()*(MAP_H-24));
      const ww=2+Math.floor(rng()*3);
      fillRect(0,wy,MAP_W,ww,T.WATER); fillRect(0,wy,MAP_W,ww,1,waterMrk);
    }else{
      const wx=12+Math.floor(rng()*(MAP_W-24));
      const ww=2+Math.floor(rng()*3);
      fillRect(wx,0,ww,MAP_H,T.WATER); fillRect(wx,0,ww,MAP_H,1,waterMrk);
    }
  }
  for(let y=4;y<MAP_H-4;){
    const w=[1,1,2,2,3,4][Math.floor(rng()*6)];
    fillRect(0,y,MAP_W,w,T.ROAD);
    y+=w+7+Math.floor(rng()*11);
  }
  for(let x=4;x<MAP_W-4;){
    const w=[1,1,2,2,3,4][Math.floor(rng()*6)];
    fillRect(x,0,w,MAP_H,T.ROAD);
    x+=w+7+Math.floor(rng()*11);
  }
  fillRect(HALF_W-1,0,3,MAP_H,T.ROAD);
  fillRect(0,HALF_H-1,MAP_W,3,T.ROAD);

  for(let i=0;i<45;i++){
    const horizontal=rng()<0.5;
    const len=4+Math.floor(rng()*8);
    const w=1+Math.floor(rng()*2);
    const x=3+Math.floor(rng()*(MAP_W-6));
    const y=3+Math.floor(rng()*(MAP_H-6));
    if(Math.abs(x-HALF_W)<4&&Math.abs(y-HALF_H)<4)continue;
    if(horizontal) fillRect(x,y,Math.min(len,MAP_W-x-2),w,T.BUILDING);
    else fillRect(x,y,w,Math.min(len,MAP_H-y-2),T.BUILDING);
  }

  for(let i=0;i<55;i++){
    const horizontal=rng()<0.5;
    const len=8+Math.floor(rng()*16);
    const w=1+Math.floor(rng()*2);
    const x=2+Math.floor(rng()*(MAP_W-4));
    const y=2+Math.floor(rng()*(MAP_H-4));
    if(horizontal) fillRect(x,y,Math.min(len,MAP_W-x-1),w,T.ROAD);
    else fillRect(x,y,w,Math.min(len,MAP_H-y-1),T.ROAD);
  }

  fillRect(HALF_W-1,0,3,MAP_H,T.ROAD);
  fillRect(0,HALF_H-1,MAP_W,3,T.ROAD);
  for(let i=0;i<MAP_W*MAP_H;i++)
    if(tileMap[i]===T.ROAD&&waterMrk[i])tileMap[i]=T.BRIDGE;
  // ── large solid parks (green blocks) ──────────────────────────────────────
  for(let i=0;i<14;i++){
    const px=4+Math.floor(rng()*(MAP_W-16)),py=4+Math.floor(rng()*(MAP_H-16));
    const pw=4+Math.floor(rng()*9),ph=4+Math.floor(rng()*9);
    let ok=true;
    loop:for(let dy=0;dy<ph;dy++) for(let dx=0;dx<pw;dx++)
      if(tileMap[mi(px+dx,py+dy)]!==T.BUILDING){ok=false;break loop;}
    if(ok)fillRect(px,py,pw,ph,T.PARK);
  }

  // ── scattered greenery in "green districts" (mixed building + park areas) ──
  // Sprinkled BEFORE buildings so buildings grow around the greenery.
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
    const id=mi(tx,ty);
    if(tileMap[id]!==T.BUILDING)continue;
    const dX=Math.floor(tx/16), dY=Math.floor(ty/16);
    if(hash2(dX+50,dY+90)<0.6)continue;          // ~40% of districts are green
    // coarse + fine noise => parks cluster into patches instead of static dots
    const patch=hash2((tx>>1)+7,(ty>>1)+3)*0.55 + hash2(tx,ty)*0.45;
    if(patch>0.58) tileMap[id]=T.PARK;
  }

  // ── greedy rectangle tiling: pack each building block with the biggest
  //    footprint that fits, so multi-tile buildings dominate and lone 1x1
  //    tiles remain only where a block is genuinely a single cell ────────────
  const free=(x,y)=> x>=0&&y>=0&&x<MAP_W&&y<MAP_H&&
                     tileMap[mi(x,y)]===T.BUILDING&&bldgW[mi(x,y)]===0;
  function claim(bx,by){
    if(!free(bx,by))return;
    const MAXW=3+Math.floor(rng()*5);   // 3..7
    const MAXD=3+Math.floor(rng()*4);   // 3..6
    let w=0; while(w<MAXW&&free(bx+w,by))w++;
    let d=1;
    grow:while(d<MAXD){
      for(let dx=0;dx<w;dx++) if(!free(bx+dx,by+d))break grow;
      d++;
    }
    bldgW[mi(bx,by)]=w; bldgD[mi(bx,by)]=d;
    for(let dy=0;dy<d;dy++) for(let dx=0;dx<w;dx++)
      if(dx!==0||dy!==0) bldgW[mi(bx+dx,by+dy)]=255;
  }
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++) claim(tx,ty);

  // ── height + style; remaining single tiles become rare 1x1 ────────────────
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
    const id=mi(tx,ty);
    if(tileMap[id]!==T.BUILDING||bldgW[id]===255)continue;
    if(bldgW[id]===0){bldgW[id]=1; bldgD[id]=1;}   // rare lone tile

    const fx=(tx-HALF_W)/HALF_W, fy=(ty-HALF_H)/HALF_H;
    const center=Math.max(0,1-Math.hypot(fx,fy));
    const districtX=Math.floor(tx/16), districtY=Math.floor(ty/16);
    const districtNoise=hash2(districtX,districtY);
    const localNoise=hash2(tx,ty);
    const big=bldgW[id]>1||bldgD[id]>1;
    const area=bldgW[id]*bldgD[id];

    // Dramatic spread: mostly low/mid, rare skyscraper districts that spike high
    const dn4        = districtNoise*districtNoise*districtNoise*districtNoise;
    const base       = 1 + center*6;                  // gentle downtown gradient
    const tower      = dn4*30;                         // only top districts spike
    const localSpike = localNoise*localNoise*11;       // per-building variation
    const bigBonus   = big ? Math.min(area,16)*0.8 : 0;
    bldgH[id]=Math.max(1,Math.min(28,Math.round(base+tower+localSpike+bigBonus)));
    bldgStyle[id]=(districtX*2+districtY*3+Math.floor(districtNoise*3))%6;
  }
}
buildMap();

// ─── coord ───────────────────────────────────────────────────────────────────
function tileCenter(tx,ty){return{x:(tx-HALF_W+0.5)*TILE,z:(ty-HALF_H+0.5)*TILE};}
function tileCenterX(wx){return (Math.floor(wx/TILE+HALF_W)-HALF_W+0.5)*TILE;}
function tileCenterZ(wz){return (Math.floor(wz/TILE+HALF_H)-HALF_H+0.5)*TILE;}
function tileAt(wx,wz){
  const tx=Math.floor(wx/TILE+HALF_W), ty=Math.floor(wz/TILE+HALF_H);
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return T.BUILDING;
  return tileMap[mi(tx,ty)];
}
function passable(wx,wz){const t=tileAt(wx,wz);return t===T.ROAD||t===T.BRIDGE;}

// ─── renderer ────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 200, 440);

const camera = new THREE.PerspectiveCamera(42,1,1,700);
camera.up.set(0,0,-1);

// ─── lighting ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 2.2));
scene.add(new THREE.HemisphereLight(0x99ccff, 0x66aa44, 1.2));
const sun = new THREE.DirectionalLight(0xfff0cc, 2.0);
sun.position.set(60,90,50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-200,right:200,top:200,bottom:-200,near:1,far:500});
scene.add(sun);

// ─── scene geometry ──────────────────────────────────────────────────────────
const cnt = new Array(5).fill(0);
for(let i=0;i<MAP_W*MAP_H;i++)cnt[tileMap[i]]++;

const flatGeo  = new THREE.BoxGeometry(TILE,0.5,TILE);
const bldgBase = new THREE.BoxGeometry(TILE*0.84,1,TILE*0.84);

const matRoad   = new THREE.MeshToonMaterial({color:0x555566});
const matBridge = new THREE.MeshToonMaterial({color:0x997755});
const matPark   = new THREE.MeshToonMaterial({color:0x55bb44});
const matWater  = new THREE.MeshToonMaterial({color:0x3399dd});

const BLDG_COLORS = [0xb8afa3,0x9ba7ad,0xa8a18f,0x8fa196,0xb0a4b8,0xaaa48d];
const bldgCnt = new Array(6).fill(0);
for(let i=0;i<MAP_W*MAP_H;i++)
  if(tileMap[i]===T.BUILDING&&bldgW[i]!==255)bldgCnt[bldgStyle[i]]++;

function iMesh(geo,mat,n){
  const m=new THREE.InstancedMesh(geo,mat,Math.max(1,n));
  m.castShadow=m.receiveShadow=true;
  scene.add(m);return m;
}

const mRoad   = iMesh(flatGeo, matRoad,   cnt[T.ROAD]);
const mBridge = iMesh(flatGeo, matBridge, cnt[T.BRIDGE]);
const mPark   = iMesh(flatGeo, matPark,   cnt[T.PARK]);
const mWater  = iMesh(flatGeo, matWater,  cnt[T.WATER]);
const mBldgs  = BLDG_COLORS.map((c,i)=>
  iMesh(bldgBase, new THREE.MeshToonMaterial({color:c}), bldgCnt[i])
);

const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(MAP_W*TILE,MAP_H*TILE),
  new THREE.MeshToonMaterial({color:0xaa9966})
);
gnd.rotation.x=-Math.PI/2; gnd.position.y=-0.1; gnd.receiveShadow=true;
scene.add(gnd);

const D = new THREE.Object3D();
const bi=[0,0,0,0,0,0];
let ri=0,bri=0,pi=0,wi=0;

for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
  const id=mi(tx,ty), tp=tileMap[id];
  const {x,z}=tileCenter(tx,ty);
  D.rotation.set(0,0,0);
  if(tp===T.ROAD){
    D.position.set(x,0.25,z);D.scale.set(1,1,1);D.updateMatrix();
    mRoad.setMatrixAt(ri++,D.matrix);
  }else if(tp===T.BRIDGE){
    D.position.set(x,0.25,z);D.scale.set(1,1,1);D.updateMatrix();
    mBridge.setMatrixAt(bri++,D.matrix);
  }else if(tp===T.PARK){
    D.position.set(x,0.2,z);D.scale.set(1,1,1);D.updateMatrix();
    mPark.setMatrixAt(pi++,D.matrix);
  }else if(tp===T.WATER){
    D.position.set(x,-0.15,z);D.scale.set(1,1,1);D.updateMatrix();
    mWater.setMatrixAt(wi++,D.matrix);
  }else if(tp===T.BUILDING){
    if(bldgW[id]===255)continue;
    const ci=bldgStyle[id], h=Math.max(1,bldgH[id]), bh=h*TILE*0.22;
    const fw=Math.max(1,bldgW[id]), fd=Math.max(1,bldgD[id]);
    const bx=x+(fw-1)*TILE*0.5, bz=z+(fd-1)*TILE*0.5;
    D.position.set(bx,bh/2+0.4,bz);D.scale.set(fw,bh,fd);D.updateMatrix();
    mBldgs[ci].setMatrixAt(bi[ci]++,D.matrix);
  }
}
[mRoad,mBridge,mPark,mWater,...mBldgs].forEach(m=>m.instanceMatrix.needsUpdate=true);

const roadMarkGeo = new THREE.PlaneGeometry(1,1);
const roadDotGeo = new THREE.CircleGeometry(1,18);
const MARK_Y = 0.535;
const MARK_EDGE = TILE*0.08;
const WHITE_LINE_W = TILE*0.055;
const WHITE_DOT_R = WHITE_LINE_W*0.62;
const YELLOW_LINE_W = TILE*0.07;
const MIN_CENTER_LEN = 7;
function makeQuarterArcGeometry(inner,outer,segments=14){
  const verts=[];
  for(let i=0;i<segments;i++){
    const a0=(i/segments)*Math.PI/2, a1=((i+1)/segments)*Math.PI/2;
    const i0=[Math.cos(a0)*inner,0,Math.sin(a0)*inner];
    const o0=[Math.cos(a0)*outer,0,Math.sin(a0)*outer];
    const i1=[Math.cos(a1)*inner,0,Math.sin(a1)*inner];
    const o1=[Math.cos(a1)*outer,0,Math.sin(a1)*outer];
    verts.push(...i0,...o0,...i1, ...o0,...o1,...i1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geo.computeVertexNormals();
  return geo;
}
const roadArcGeo = makeQuarterArcGeometry(
  Math.max(0.01,MARK_EDGE-WHITE_LINE_W*0.5),
  MARK_EDGE+WHITE_LINE_W*0.5
);
const roadWhiteMat = new THREE.MeshBasicMaterial({color:0xf7f4e8,opacity:0.82,transparent:true,depthWrite:false,side:THREE.DoubleSide});
const roadYellowMat = new THREE.MeshBasicMaterial({color:0xffd84a,opacity:0.48,transparent:true,depthWrite:false,side:THREE.DoubleSide});
const whiteMarks = [], whiteDots = [], whiteArcs = [], yellowMarks = [];

function isRoadish(tx,ty){
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return false;
  const t=tileMap[mi(tx,ty)];
  return t===T.ROAD||t===T.BRIDGE;
}
function isBuildingTile(tx,ty){
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)return true;
  return tileMap[mi(tx,ty)]===T.BUILDING;
}
function addMark(list,x,z,w,d,rot=0){
  list.push({x,z,w,d,rot});
}
function addDot(list,x,z,r){list.push({x,z,r});}
function addArc(list,x,z,rot){list.push({x,z,rot});}
function edgeX(ex){return (ex-HALF_W)*TILE;}
function edgeZ(ey){return (ey-HALF_H)*TILE;}

function addWhiteV(ex,start,end,roadSide){
  const x=edgeX(ex)+roadSide*MARK_EDGE;
  const z=(edgeZ(start)+edgeZ(end+1))*0.5;
  addMark(whiteMarks,x,z,WHITE_LINE_W,(end-start+1)*TILE);
  addDot(whiteDots,x,edgeZ(start),WHITE_DOT_R);
  addDot(whiteDots,x,edgeZ(end+1),WHITE_DOT_R);
}
function addWhiteH(ey,start,end,roadSide){
  const x=(edgeX(start)+edgeX(end+1))*0.5;
  const z=edgeZ(ey)+roadSide*MARK_EDGE;
  addMark(whiteMarks,x,z,(end-start+1)*TILE,WHITE_LINE_W);
  addDot(whiteDots,edgeX(start),z,WHITE_DOT_R);
  addDot(whiteDots,edgeX(end+1),z,WHITE_DOT_R);
}

for(let ex=0;ex<=MAP_W;ex++){
  for(const roadSide of [-1,1]){
    let start=-1;
    for(let ty=0;ty<MAP_H;ty++){
      const road=roadSide>0?isRoadish(ex,ty):isRoadish(ex-1,ty);
      const wall=roadSide>0?isBuildingTile(ex-1,ty):isBuildingTile(ex,ty);
      if(road&&wall){if(start<0)start=ty;}
      else if(start>=0){addWhiteV(ex,start,ty-1,roadSide);start=-1;}
    }
    if(start>=0)addWhiteV(ex,start,MAP_H-1,roadSide);
  }
}

for(let ey=0;ey<=MAP_H;ey++){
  for(const roadSide of [-1,1]){
    let start=-1;
    for(let tx=0;tx<MAP_W;tx++){
      const road=roadSide>0?isRoadish(tx,ey):isRoadish(tx,ey-1);
      const wall=roadSide>0?isBuildingTile(tx,ey-1):isBuildingTile(tx,ey);
      if(road&&wall){if(start<0)start=tx;}
      else if(start>=0){addWhiteH(ey,start,tx-1,roadSide);start=-1;}
    }
    if(start>=0)addWhiteH(ey,start,MAP_W-1,roadSide);
  }
}

for(let ey=1;ey<MAP_H;ey++) for(let ex=1;ex<MAP_W;ex++){
  const x=edgeX(ex), z=edgeZ(ey);
  const nwB=isBuildingTile(ex-1,ey-1), neB=isBuildingTile(ex,ey-1);
  const swB=isBuildingTile(ex-1,ey),   seB=isBuildingTile(ex,ey);
  const nwR=isRoadish(ex-1,ey-1), neR=isRoadish(ex,ey-1);
  const swR=isRoadish(ex-1,ey),   seR=isRoadish(ex,ey);

  if(nwB&&neR&&swR)addArc(whiteArcs,x,z,0);
  if(neB&&nwR&&seR)addArc(whiteArcs,x,z,-Math.PI/2);
  if(seB&&neR&&swR)addArc(whiteArcs,x,z,Math.PI);
  if(swB&&nwR&&seR)addArc(whiteArcs,x,z,Math.PI/2);
}

function addYellowH(ey,start,end){
  const x=(edgeX(start)+edgeX(end+1))*0.5;
  addMark(yellowMarks,x,edgeZ(ey),(end-start+1)*TILE,YELLOW_LINE_W);
}
function addYellowV(ex,start,end){
  const z=(edgeZ(start)+edgeZ(end+1))*0.5;
  addMark(yellowMarks,edgeX(ex),z,YELLOW_LINE_W,(end-start+1)*TILE);
}
function roadWidthAcrossZ(tx,ey){
  let up=0,down=0;
  for(let y=ey-1;y>=0&&isRoadish(tx,y);y--)up++;
  for(let y=ey;y<MAP_H&&isRoadish(tx,y);y++)down++;
  return {up,down};
}
function roadWidthAcrossX(ex,ty){
  let left=0,right=0;
  for(let x=ex-1;x>=0&&isRoadish(x,ty);x--)left++;
  for(let x=ex;x<MAP_W&&isRoadish(x,ty);x++)right++;
  return {left,right};
}

for(let ey=1;ey<MAP_H;ey++){
  let start=-1;
  for(let tx=0;tx<MAP_W;tx++){
    const {up,down}=roadWidthAcrossZ(tx,ey);
    const twoLane=isRoadish(tx,ey-1)&&isRoadish(tx,ey)&&
      up===down&&up+down>=2&&
      isRoadish(tx-1,ey-1)&&isRoadish(tx+1,ey-1)&&
      isRoadish(tx-1,ey)&&isRoadish(tx+1,ey);
    if(twoLane){if(start<0)start=tx;}
    else if(start>=0){
      if(tx-start>=MIN_CENTER_LEN)addYellowH(ey,start,tx-1);
      start=-1;
    }
  }
  if(start>=0&&MAP_W-start>=MIN_CENTER_LEN)addYellowH(ey,start,MAP_W-1);
}

for(let ex=1;ex<MAP_W;ex++){
  let start=-1;
  for(let ty=0;ty<MAP_H;ty++){
    const {left,right}=roadWidthAcrossX(ex,ty);
    const twoLane=isRoadish(ex-1,ty)&&isRoadish(ex,ty)&&
      left===right&&left+right>=2&&
      isRoadish(ex-1,ty-1)&&isRoadish(ex-1,ty+1)&&
      isRoadish(ex,ty-1)&&isRoadish(ex,ty+1);
    if(twoLane){if(start<0)start=ty;}
    else if(start>=0){
      if(ty-start>=MIN_CENTER_LEN)addYellowV(ex,start,ty-1);
      start=-1;
    }
  }
  if(start>=0&&MAP_H-start>=MIN_CENTER_LEN)addYellowV(ex,start,MAP_H-1);
}

function wideRoadAt(tx,ty){
  if(!isRoadish(tx,ty))return false;
  let near=0;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++)
    if(dx!==0||dy!==0)near+=isRoadish(tx+dx,ty+dy)?1:0;
  const cross=(isRoadish(tx-1,ty)&&isRoadish(tx+1,ty))+
              (isRoadish(tx,ty-1)&&isRoadish(tx,ty+1));
  return near>=5||cross===2;
}
function drawSafetyZone(cx,cz,w,d){
  const thick=TILE*0.075;
  addMark(yellowMarks,cx,cz-d*0.5, w, thick);
  addMark(yellowMarks,cx,cz+d*0.5, w, thick);
  addMark(yellowMarks,cx-w*0.5,cz, thick, d);
  addMark(yellowMarks,cx+w*0.5,cz, thick, d);

  const stripes=Math.max(3,Math.floor(Math.min(w,d)/(TILE*0.38)));
  const len=Math.min(w,d)*0.7;
  for(let i=0;i<stripes;i++){
    const t=stripes===1?0:i/(stripes-1);
    addMark(yellowMarks,cx+(t-0.5)*w*0.68,cz,TILE*0.055,len,Math.PI/4);
  }
}

const wideSeen = new Uint8Array(MAP_W*MAP_H);
for(let ty=1;ty<MAP_H-1;ty++) for(let tx=1;tx<MAP_W-1;tx++){
  const start=mi(tx,ty);
  if(wideSeen[start]||!wideRoadAt(tx,ty))continue;

  let minX=tx,maxX=tx,minY=ty,maxY=ty,count=0;
  const stack=[[tx,ty]];
  wideSeen[start]=1;
  while(stack.length){
    const [cx,cy]=stack.pop();
    count++;
    minX=Math.min(minX,cx); maxX=Math.max(maxX,cx);
    minY=Math.min(minY,cy); maxY=Math.max(maxY,cy);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=cx+dx, ny=cy+dy;
      if(nx<1||nx>=MAP_W-1||ny<1||ny>=MAP_H-1)return;
      const id=mi(nx,ny);
      if(wideSeen[id]||!wideRoadAt(nx,ny))return;
      wideSeen[id]=1; stack.push([nx,ny]);
    });
  }

  const cw=maxX-minX+1, cd=maxY-minY+1;
  if(count<3||cw<2||cd<2)continue;
  const c0=tileCenter(Math.floor((minX+maxX)/2),Math.floor((minY+maxY)/2));
  const boxW=Math.min(TILE*3.2,Math.max(TILE*1.25,cw*TILE*0.62));
  const boxD=Math.min(TILE*3.2,Math.max(TILE*1.25,cd*TILE*0.62));
  drawSafetyZone(c0.x,c0.z,boxW,boxD);
}

const sData = Array.from({length:SCOUNT},()=>({active:false,vx:0,vy:0,vz:0,life:0,maxLife:1.0}));
let pHead=0, sHead=0;

function spawnEffects(x,z,fwX,fwZ,spd){
  if(spd<5)return;
  const px=-fwZ, pz=fwX; // perpendicular (local +Z in world)
  const rCX=x-fwX*R*1.05, rCZ=z-fwZ*R*1.05;

  // rear-right and rear-left wheel world positions
  const wpos=[
    [rCX+px*R*1.22, rCZ+pz*R*1.22],
    [rCX-px*R*1.22, rCZ-pz*R*1.22],
  ];

  for(const [wx,wz] of wpos){
    const idx=pHead%PCOUNT; pHead++;
    const p=pData[idx], m=pebbleMeshes[idx];
    const lat=(Math.random()-0.5)*2.5;
    const bs=4+Math.random()*10;
    p.active=true;
    p.vx=-fwX*bs+px*lat; p.vy=4+Math.random()*12; p.vz=-fwZ*bs+pz*lat;
    p.life=1.0; p.maxLife=0.35+Math.random()*0.3;
    m.position.set(wx+(Math.random()-0.5)*0.5, 0.3, wz+(Math.random()-0.5)*0.5);
    m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    m.visible=true;
  }

  // smoke from car body center
  const sidx=sHead%SCOUNT; sHead++;
  const s=sData[sidx], sm=smokeMeshes[sidx];
  s.active=true;
  s.vx=(Math.random()-0.5)*0.6; s.vy=0.6+Math.random()*1.0; s.vz=(Math.random()-0.5)*0.6;
  s.life=1.0; s.maxLife=0.8+Math.random()*0.4;
  sm.position.set(x,1.2,z); sm.scale.setScalar(0.9);
  sm.material.opacity=0.42; sm.visible=true;
}

function updateParticles(dt){
  for(let i=0;i<PCOUNT;i++){
    const p=pData[i]; if(!p.active)continue;
    p.life-=dt/p.maxLife;
    if(p.life<=0){p.active=false;pebbleMeshes[i].visible=false;continue;}
    const m=pebbleMeshes[i];
    m.position.x+=p.vx*dt; m.position.y+=p.vy*dt; m.position.z+=p.vz*dt;
    p.vy-=22*dt;
    m.rotation.x+=p.vx*dt*3; m.rotation.z+=p.vz*dt*3;
    if(m.position.y<0.15){
      m.position.y=0.15; p.vy*=-0.25; p.vx*=0.55; p.vz*=0.55;
    }
  }
  for(let i=0;i<SCOUNT;i++){
    const s=sData[i]; if(!s.active)continue;
    s.life-=dt/s.maxLife;
    if(s.life<=0){s.active=false;smokeMeshes[i].visible=false;continue;}
    const m=smokeMeshes[i];
    m.position.x+=s.vx*dt; m.position.y+=s.vy*dt; m.position.z+=s.vz*dt;
    m.scale.setScalar(1+(1-s.life)*3);
    m.material.opacity=s.life*0.48;
  }
}

const joyEl   = document.getElementById('joystick');
const stickEl = document.getElementById('stick');
const JOY_R   = 48;              // max stick travel radius (px) & deadzone scale
let joyVisible = false;          // joystick shown (button faded while true)
let joyActive  = false;          // joystick currently driving (finger held >0.5s)
let joyDX = 0, joyDY = 0;        // clamped stick offset from origin (px)
let joyOX = 0, joyOY = 0;        // origin (touch start point)
let touchId = null;              // tracked touch identifier
let holdTimer = null, hideTimer = null;

function showJoystick(x,y){
  joyOX=x; joyOY=y; joyDX=0; joyDY=0;
  joyEl.style.left=x+'px'; joyEl.style.top=y+'px';
  stickEl.style.transform='translate(-50%,-50%)';
  joyEl.classList.add('on');
  recalBtn.classList.add('faded');   // fade out recalibrate while joystick is up
  joyVisible=true; joyActive=true;
}
function moveStick(x,y){
  let dx=x-joyOX, dy=y-joyOY;
  const d=Math.hypot(dx,dy);
  if(d>JOY_R){ dx=dx/d*JOY_R; dy=dy/d*JOY_R; }
  joyDX=dx; joyDY=dy;
  stickEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function hideJoystick(){
  joyVisible=false;
  joyEl.classList.remove('on');
  recalBtn.classList.remove('faded'); // fade recalibrate back in (re-enables tilt)
}

  if(!gameOn||touchId!==null) return;
  const t=e.changedTouches[0];
  touchId=t.identifier;
  const x=t.clientX, y=t.clientY;
  clearTimeout(hideTimer);                       // cancel pending fade-out
  clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>showJoystick(x,y),500); // appears after 0.5s hold
},{passive:false});

canvasEl.addEventListener('touchmove',e=>{
  if(touchId===null) return;
  const t=[...e.changedTouches].find(c=>c.identifier===touchId);
  if(!t) return;
  if(joyActive){ e.preventDefault(); moveStick(t.clientX,t.clientY); }
},{passive:false});

function endTouch(e){
  if(touchId===null) return;
  if(![...e.changedTouches].some(c=>c.identifier===touchId)) return;
  touchId=null;
  clearTimeout(holdTimer);
  if(joyActive){
    joyActive=false; joyDX=0; joyDY=0;           // stop driving, keep visible
    stickEl.style.transform='translate(-50%,-50%)';
    clearTimeout(hideTimer);
    hideTimer=setTimeout(hideJoystick,1000);     // disappears 1s after release
  }
}

// ─── post-processing: barrel distortion ──────────────────────────────────────
const BarrelShader = {
  uniforms: {
    tDiffuse: { value: null },
    k:        { value: 0.32 },  // barrel strength (0 = off, higher = more fisheye)
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float k;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv - 0.5;
      float r2 = dot(uv, uv);
      vec2 distorted = uv * (1.0 + k * r2);
      // Normalize by max corner distortion so edges always reach screen bounds — no clipping
      distorted /= (1.0 + k * 0.5);
      gl_FragColor = texture2D(tDiffuse, distorted + 0.5);
    }
  `,
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new ShaderPass(BarrelShader));

// Collision box aligned to movement direction (ndX,ndZ), not visual facing
function cornersForDir(px,pz,ndX,ndZ){
  const rpX=-ndZ, rpZ=ndX;
  return[
    [px+ndX*CAR_HL+rpX*CAR_HW, pz+ndZ*CAR_HL+rpZ*CAR_HW],
    [px+ndX*CAR_HL-rpX*CAR_HW, pz+ndZ*CAR_HL-rpZ*CAR_HW],
    [px-ndX*CAR_HL+rpX*CAR_HW, pz-ndZ*CAR_HL+rpZ*CAR_HW],
    [px-ndX*CAR_HL-rpX*CAR_HW, pz-ndZ*CAR_HL-rpZ*CAR_HW],
  ];
}
function leadingPointsForDir(px,pz,ndX,ndZ){
  const rpX=-ndZ, rpZ=ndX;
  const noseX=px+ndX*CAR_HL, noseZ=pz+ndZ*CAR_HL;
  return[
    [noseX+rpX*CAR_HW, noseZ+rpZ*CAR_HW],
    [noseX-rpX*CAR_HW, noseZ-rpZ*CAR_HW],
    [noseX, noseZ],
  ];
}
function blockedCornersForDir(px,pz,ndX,ndZ){
  return cornersForDir(px,pz,ndX,ndZ).filter(([cx,cz])=>!passable(cx,cz));
}
function clearForDir(px,pz,ndX,ndZ){
  return blockedCornersForDir(px,pz,ndX,ndZ).length===0;
}
function leadingClearForDir(px,pz,ndX,ndZ){
  return leadingPointsForDir(px,pz,ndX,ndZ).every(([cx,cz])=>passable(cx,cz));
}
function canMoveToward(px,pz,nx,nz,ndX,ndZ){
  if(clearForDir(nx,nz,ndX,ndZ))return true;
  const currentHits=blockedCornersForDir(px,pz,ndX,ndZ).length;
  const nextHits=blockedCornersForDir(nx,nz,ndX,ndZ).length;
  return currentHits>0&&nextHits<=currentHits&&leadingClearForDir(nx,nz,ndX,ndZ);
}
function pushFromWalls(px,pz,ndX,ndZ,dt){
  const hits=blockedCornersForDir(px,pz,ndX,ndZ);
  if(hits.length===0)return {x:px,z:pz};

  let pushX=0, pushZ=0;
  hits.forEach(([cx,cz])=>{
    pushX+=px-cx;
    pushZ+=pz-cz;
  });
  const len=Math.hypot(pushX,pushZ);
  if(len<0.001)return {x:px,z:pz};

  const step=Math.min(TILE*0.22, CONST_SPEED*dt*0.85);
  const ux=pushX/len, uz=pushZ/len;
  for(const mul of [1,0.6,0.35]){
    const tx=px+ux*step*mul;
    const tz=pz+uz*step*mul;
    if(clearForDir(tx,tz,ndX,ndZ))return {x:tx,z:tz};
    const nextHits=blockedCornersForDir(tx,tz,ndX,ndZ).length;
    if(nextHits<=hits.length&&leadingClearForDir(tx,tz,ndX,ndZ))
      return {x:tx,z:tz};
  }
  return {x:px,z:pz};
}
function moveWithCollision(px,pz,ndX,ndZ,dt){
  const spd=CONST_SPEED*dt;
  const rpX=-ndZ, rpZ=ndX;
  const nx=px+ndX*spd, nz=pz+ndZ*spd;

  // Fully clear — move straight
  if(clearForDir(nx,nz,ndX,ndZ))
    return {x:nx,z:nz,moved:true};

  const maxAlign=Math.min(TILE*0.32,spd*0.9);
  const alignX=rpX===0?0:Math.max(-maxAlign,Math.min(maxAlign,tileCenterX(px)-px));
  const alignZ=rpZ===0?0:Math.max(-maxAlign,Math.min(maxAlign,tileCenterZ(pz)-pz));
  if((alignX!==0||alignZ!==0)&&
     passable(px+alignX,pz+alignZ)&&
     clearForDir(nx+alignX,nz+alignZ,ndX,ndZ))
    return {x:nx+alignX,z:nz+alignZ,moved:true};

  // Wall slide: fewer blocked corners + leading edge still open
  if(canMoveToward(px,pz,nx,nz,ndX,ndZ)){
    const pushed=pushFromWalls(nx,nz,ndX,ndZ,dt);
    return {x:pushed.x,z:pushed.z,moved:true};
  }

  return {x:px,z:pz,moved:false};
}

// ─── loop ────────────────────────────────────────────────────────────────────
let last=performance.now();

function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  const dt=Math.min((now-last)/1000,0.05);
  last=now;

  if(gameOn&&sensorOk){
    // ── player steers: key/tilt = desired direction, accepted only if passable ─
    let wantX=0, wantZ=0;
    if     (keys['ArrowUp']   ||keys['KeyW']) { wantX=0;  wantZ=-1; }
    else if(keys['ArrowDown'] ||keys['KeyS']) { wantX=0;  wantZ=1;  }
    else if(keys['ArrowRight']||keys['KeyD']) { wantX=1;  wantZ=0;  }
    else if(keys['ArrowLeft'] ||keys['KeyA']) { wantX=-1; wantZ=0;  }

    // Virtual joystick: dominant drag axis (only when no key pressed)
    if(wantX===0&&wantZ===0 && joyActive){
      const ax=Math.abs(joyDX), ay=Math.abs(joyDY);
      if(Math.max(ax,ay) > 14){
        if(ax>=ay){ wantX = joyDX>0 ? 1 : -1; wantZ=0; }
        else      { wantZ = joyDY>0 ? 1 : -1; wantX=0; }
      }
    }

    // Sensor: dominant tilt axis — only when no key/joystick and recalibrate button active
    if(wantX===0&&wantZ===0 && !joyVisible){
      const tiltFwd  = rawBeta  - baseBeta;
      const tiltSide = rawGamma - baseGamma;
      const FD = 8;
      const afwd = Math.abs(tiltFwd), aside = Math.abs(tiltSide);
      if(Math.max(afwd, aside) > FD){
        if(afwd >= aside){ wantX=0; wantZ = tiltFwd>0 ? 1 : -1; }
        else             { wantX = tiltSide>0 ? 1 : -1; wantZ=0; }
      }
    }

    // Apply player steer when the new direction's leading edge is clear
    if((wantX!==0||wantZ!==0)&&(wantX!==dirX||wantZ!==dirZ)){
      const wnx=carGroup.position.x+wantX*CONST_SPEED*dt;
      const wnz=carGroup.position.z+wantZ*CONST_SPEED*dt;
      if(leadingClearForDir(wnx,wnz,wantX,wantZ)){
        prevDirX=dirX; prevDirZ=dirZ;
        dirX=wantX; dirZ=wantZ;
        stuckTimer=0;
      }
    }

    // ── always move; auto-turn on wall hit ───────────────────────────────────
    const move=moveWithCollision(carGroup.position.x,carGroup.position.z,dirX,dirZ,dt);

    if(move.moved){
      carGroup.position.x=move.x;
      carGroup.position.z=move.z;
      stuckTimer=0;
    }else{
      stuckTimer+=dt;

      const rX=-dirZ, rZ=dirX, lX=dirZ, lZ=-dirX, bX=-dirX, bZ=-dirZ;

      // prevDir is useful only when it isn't current dir or its reverse
      const prevIsUseful=(prevDirX!==dirX||prevDirZ!==dirZ)
                        &&(prevDirX!==bX   ||prevDirZ!==bZ);

      let tries;
      if(stuckTimer>0.4){
        // Stuck in dead-end (ㄷ-shape etc): force reverse to break the loop
        tries=[[bX,bZ],[rX,rZ],[lX,lZ]];
        stuckTimer=0;
      }else if(prevIsUseful){
        // Natural momentum: prefer the direction we came from before the last turn
        const sides=turnBias>0?[[rX,rZ],[lX,lZ]]:[[lX,lZ],[rX,rZ]];
        tries=[[prevDirX,prevDirZ],...sides,[bX,bZ]];
      }else{
        tries=turnBias>0?[[rX,rZ],[lX,lZ],[bX,bZ]]:[[lX,lZ],[rX,rZ],[bX,bZ]];
      }

      for(const [tx,tz] of tries){
        const tnx=carGroup.position.x+tx*CONST_SPEED*dt;
        const tnz=carGroup.position.z+tz*CONST_SPEED*dt;
        if(leadingClearForDir(tnx,tnz,tx,tz)){
          const turnMove=moveWithCollision(carGroup.position.x,carGroup.position.z,tx,tz,dt);
          if(!turnMove.moved)continue;
          prevDirX=dirX; prevDirZ=dirZ;
          dirX=tx; dirZ=tz;
          carGroup.position.x=turnMove.x;
          carGroup.position.z=turnMove.z;
          turnBias*=-1;
          stuckTimer=0;
          break;
        }
      }
    }

    // ── visual rotation toward current direction ──────────────────────────────
    targetRotY=Math.atan2(-dirZ, dirX);
    let diff=targetRotY-carGroup.rotation.y;
    while(diff>Math.PI)  diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    carGroup.rotation.y+=Math.sign(diff)*Math.min(Math.abs(diff), ROT_SPEED*dt);

    // ── wheel spin ────────────────────────────────────────────────────────────
    wheelAngle-=CONST_SPEED*dt/wR_;
    wheelMeshes.forEach(w=>w.rotation.y=wheelAngle);

    // ── particles ─────────────────────────────────────────────────────────────
    particleTimer+=dt;
    if(particleTimer>0.055){
      particleTimer=0;
      spawnEffects(carGroup.position.x,carGroup.position.z,dirX,dirZ,CONST_SPEED);
    }
    updateParticles(dt);

    // ── position-slide perspective top-view camera ────────────────────────────
    const tgtX=carGroup.position.x;
    const tgtZ=carGroup.position.z;
    targetCameraLead.set(-dirX*CAMERA_POS_LEAD,0,-dirZ*CAMERA_POS_LEAD);
    cameraLead.lerp(targetCameraLead, 1-Math.exp(-2.4*dt));
    setTopCamera(tgtX,tgtZ);

    // ── hud ───────────────────────────────────────────────────────────────────
    const dirArrow=dirX>0?'→':dirX<0?'←':dirZ<0?'↑':'↓';
    hud.textContent=`${dirArrow} ${(CONST_SPEED*3.6).toFixed(0)} km/h`;

  }else if(!gameOn){
    cameraLead.lerp(ZERO_CAMERA_LEAD, 1-Math.exp(-2.4*dt));
    setTopCamera(sx,sz);
  }

  composer.render();
}

tick();
</script>
